- name: Setup Ubuntu WSL
  hosts: localhost
  vars:
    username: hiterm
  tasks:
  - name: Install packages
    ansible.builtin.apt:
      name:
        - chezmoi
      update_cache: yes
    become: yes
  - name: chezmoi init
    ansible.builtin.command:
      argv:
        - chezmoi
        - init
        - hiterm/dotfiles-chezmoi
  - name: chezmoi apply
    ansible.builtin.command:
      argv:
        - chezmoi
        - apply
  - name: Install packages
    ansible.builtin.apt:
      name:
        - build-essential
        - wget
        - zsh
        - git
        - gh
        - fzf
        - openssh-client
        - ripgrep
        - neovim
        - bat
        - zoxide
        - delta
        - ghq
      update_cache: yes
    become: yes

  - name: chsh
    ansible.builtin.command:
      argv:
        - chsh
        - -s
        - /usr/bin/zsh
        - "{{ username }}"
    become: yes